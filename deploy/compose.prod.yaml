# Public deployment: Caddy (HTTPS, only published ports 80/443) in front of the app (no published port).
#   DOMAIN=spiel.example.ch ACME_EMAIL=you@example.ch docker compose -f deploy/compose.prod.yaml up -d --build
# Hardening rationale: docs/DESIGN.md #46. Seamless updates (1012 + client reload): #44.
services:
  app:
    build:
      context: ..
      args:
        # optional: pin the id of this build; empty = derived from the build time (a new image always has a new id)
        BUILD_ID: ${BUILD_ID:-}
    image: hochstapler:latest
    restart: unless-stopped
    # SIGTERM → persist games, tell players to reconnect (1012); 15 s safety margin before SIGKILL
    stop_grace_period: 15s
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    environment:
      HTTPS_ONLY: "1" # HSTS + upgrade-insecure-requests
      TRUST_PROXY_HOPS: "1" # Caddy sets x-forwarded-for to the client address; per-client rate limits use that entry (DESIGN #59)
      BOT_DELAY_MS: "700"
      # writer lease (DESIGN #89): lock file next to the database; safe because the volume is a local disk
      WRITER_LEASE: file
    expose:
      - "8787"
    volumes:
      - hochstapler-data:/data
    networks:
      - internal

  caddy:
    image: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 256
    mem_limit: 256m
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. spiel.example.ch}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt}
      UPSTREAM: app:8787
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
      - public

networks:
  internal:
    internal: true # the app has no route to the internet
  public:

volumes:
  hochstapler-data:
  caddy-data:
  caddy-config:
